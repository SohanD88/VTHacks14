[project]
name = "spatial-intelligence-api"
version = "0.1.0"
description = "First spatial scanning vertical slice"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "Pillow>=10,<12",
    "rfdetr==1.10.1",
    "opencv-python-headless>=4.10,<5",
    "av>=14,<17",
    "python-multipart>=0.0.20",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "transformers>=5,<6",
    "google-genai==2.24.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
